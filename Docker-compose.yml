version: '0.1'
networks:
  netBackEnd:
    ipam:
      driver: default
      config:
        - subnet: 192.168.0.0/24
services:
 mongodb:
   container_name: mongodb
   image: pdvservices.azurecr.io/mongo:latest
   restart: always
   ports:
   - "27017:27017"
   networks:
      netBackEnd:
        ipv4_address: 192.168.0.2
 products.api:
  image: pdvservices.azurecr.io/products.api
  build: API/ProductsAPI
  restart: always
  container_name: products.api
  depends_on:
  - mongodb
  ports:
  - "5056:80"
  environment:
  - ASPNETCORE_URLS=http://+:80
  networks:
    netBackEnd:
      ipv4_address: 192.168.0.3