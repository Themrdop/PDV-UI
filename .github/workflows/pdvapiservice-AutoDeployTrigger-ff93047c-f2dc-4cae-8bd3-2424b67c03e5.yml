name: Trigger auto deployment for pdvapiservice

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/pdvapiservice-AutoDeployTrigger-ff93047c-f2dc-4cae-8bd3-2424b67c03e5.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.PDVAPISERVICE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PDVAPISERVICE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PDVAPISERVICE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/API/productsAPI
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: pdvservices.azurecr.io
          registryUsername: ${{ secrets.PDVAPISERVICE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PDVAPISERVICE_REGISTRY_PASSWORD }}
          containerAppName: pdvapiservice
          resourceGroup: PDV
          imageToBuild: pdvservices.azurecr.io/pdvapiservice:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


