version: '0.1'
networks:
  netBackEnd:
    ipam:
      driver: default
      config:
        - subnet: 192.168.0.0/24
services:
 mongodb:
   container_name: mongodb
   image: mongo
   restart: always
   ports:
   - "27017:27017"
   networks:
      netBackEnd:
        ipv4_address: 192.168.0.2
 products.api:
  build: ./
  container_name: products.api
  depends_on:
  - mongodb
  ports:
  - "5056:80"
  networks:
    netBackEnd: